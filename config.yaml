server:
  # server.host stays on localhost. IPv6 loopback is ::1; the booth also accepts Host: [::1]:port.
  host: 127.0.0.1
  port: 8080
  # The booth has no auth. Stay on localhost unless you set this true on purpose.
  allow_remote: false

ollama:
  host: http://127.0.0.1:11434
  # snappy profile keeps this 3B model. quality profile switches a 3B default to the 7B below.
  model: qwen2.5:3b
  timeout_seconds: 120
  num_ctx: 4096
  num_predict_chat: 80
  num_predict_voice: 160
  keep_alive: 30m
  # Bounds chat replies, alert replies, and the recap vibe paragraph.
  chat_timeout_seconds: 20

# snappy: Whisper on CUDA + qwen2.5:3b (fits an 8 GB GPU with Whisper).
# quality: forces Whisper onto CPU and, if the model is still the 3B default, uses the 7B.
vram:
  profile: snappy
  warn_mb: 7000
  quality_model: qwen2.5:7b-instruct-q4_K_M

whisper:
  model_size: small
  # auto | cuda | cpu  — auto uses CUDA when ctranslate2 sees an NVIDIA GPU
  device: auto
  language: en
  compute_type_cuda: float16
  compute_type_cpu: int8

tts:
  enabled: true
  mute: false
  # Cute US female (Amy). Other females: en_US-kristin-medium, en_US-hfc_female-medium
  voice: en_US-amy-medium
  length_scale: 1.05
  piper_dir: models/piper
  max_sentence_chars: 280
  voices:
    - en_US-amy-medium
    - en_US-kristin-medium
    - en_US-hfc_female-medium

audio:
  sample_rate: 16000
  mic_device: null          # null = system default; override with a device index
  mic_device_name: null     # re-resolved at startup if the index moves
  speaker_device: null
  speaker_device_name: null
  silence_ms: 800
  min_utterance_ms: 350
  energy_threshold: 0.012   # RMS; raise if it false-triggers
  max_utterance_seconds: 20
  # Optional per-app session ducking. Off by default. On Windows, pycaw lowers matching
  # app sessions while Pixel talks. Pixel's own process is never ducked. An empty
  # duck_apps list ducks every other app except duck_skip. Without pycaw, use an OBS sidechain.
  duck_enabled: false
  duck_gain: 0.25
  duck_apps: []
  duck_skip:
    - obs64.exe
    - Discord.exe
  # Talk-over stops Pixel. Echo gate ignores speaker bleed unless PTT is held or the level is much louder.
  barge_in: true
  echo_gate: true
  echo_gate_ratio: 2.5
  # audio.wake_word uses openwakeword and never replaces hold-to-talk.
  # audio.wake_models names the models. audio.wake_threshold is 0 to 1; raise it when a phrase false-triggers.
  wake_word: false
  wake_models:
    - hey_jarvis
  wake_threshold: 0.5

chat:
  buffer_size: 40
  cooldown_seconds: 12
  max_replies_per_minute: 8
  scan_interval_seconds: 3
  mention_boost: true
  post_voice_replies_to_chat: true
  chat_max_chars: 200
  per_user_cooldown_seconds: 20
  auto_reconnect: true
  min_send_gap_seconds: 1.2
  ambient_context_lines: 6
  commands:
    - "!so"
    - "!pixel"
    - "!ask"
  # !so is also a mod command: viewers are dropped with skip reason "not a mod".
  mod_commands:
    - "!so"
  shoutout_cooldown_seconds: 120
  # Posted for !so. {user} is the login. A shoutout of the last raider still says "welcome in".
  shoutout_line: "go check out {user}"
  shoutout_speak: true
  # Empty derives !<persona name>. !pixel always stays as an alias.
  control_command: ""
  # Pending viewer lines older than this are dropped (streamer lines and commands stay).
  max_age_seconds: 45
  # First-time chatters get a short typed welcome instead of a spoken reply.
  welcome_first_time: true
  # Gap between mod !pixel mute/unmute/chill/hype/stop commands.
  control_cooldown_seconds: 4
  # When true, !ask waits in the Questions list instead of being answered immediately.
  ask_queue: false
  # Gap between mod !pixel clip commands.
  clip_cooldown_seconds: 60
  # Fixed text replies. {user} is the chatter. No model and no shoutout.
  # Each command has its own timer of custom_command_cooldown_seconds.
  # custom_commands:
  #   "!lurk": "enjoy the lurk {user}"
  #   "!discord": "discord is linked in the panels"
  custom_commands: {}
  custom_command_cooldown_seconds: 30

memory:
  chat_context_lines: 20
  events: 80
  viewers: 48
  thread_turns: 12
  catchphrase_seconds: 600
  retention_days: 14

events:
  enabled: true
  announce_follows: true
  follow_batch_seconds: 8
  speak: true
  post_to_chat: true
  # Each of these is off until you turn it on. Missing scopes skip that feed only.
  bits: false
  channel_points: false
  hype_train: false
  polls: false
  predictions: false
  ad_breaks: false
  shoutouts: false
  # On stream.offline, stop the mic and mark the booth idle.
  idle_on_offline: true
  channel_point_rewards:
    hydrate: speak
    # A reward can also be a mapping. {user} and {input} are filled in, and input is fenced.
    # "roast me":
    #   action: speak
    #   prompt: "Playfully roast {user} in one line, nothing mean about looks. They wrote: {input}"
    #   cooldown: 120

overlay:
  alert_hold_seconds: 6

logging:
  level: INFO
  # Logger names that stay at DEBUG, for example ["cohost.mic", "cohost.tts"].
  debug_modules: []

safety:
  # Pixel strips links from chat posts unless this is true.
  allow_links: false

# Named booth presets. POST /api/profile applies one and stores the name in data/booth.json.
# A profile may also set tts_voice (one of tts.voices), length_scale, and persona_file.
profiles:
  "Just chatting":
    mood: hype
    cooldown_seconds: 8
    per_user_cooldown_seconds: 12
    events.speak: true
    post_voice_replies_to_chat: true
    max_replies_per_minute: 12
  "Focus game":
    mood: chill
    cooldown_seconds: 30
    per_user_cooldown_seconds: 45
    events.speak: false
    post_voice_replies_to_chat: false
    max_replies_per_minute: 3
