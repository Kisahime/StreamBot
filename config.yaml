server:
  host: 127.0.0.1
  port: 8080
  # The booth has no auth. Stay on localhost unless you set this true on purpose.
  allow_remote: false

ollama:
  host: http://127.0.0.1:11434
  # snappy profile keeps this 3B model. quality profile switches a 3B default to the 7B below.
  model: qwen2.5:3b
  timeout_seconds: 120
  num_ctx: 4096
  num_predict_chat: 80
  num_predict_voice: 160
  keep_alive: 30m
  # Chat completions give up after this so a slow model can't stall the chat worker.
  chat_timeout_seconds: 20

# snappy: Whisper on CUDA + qwen2.5:3b (fits an 8 GB GPU with Whisper).
# quality: forces Whisper onto CPU and, if the model is still the 3B default, uses the 7B.
vram:
  profile: snappy
  warn_mb: 7000
  quality_model: qwen2.5:7b-instruct-q4_K_M

whisper:
  model_size: small
  # auto | cuda | cpu  — auto uses CUDA when ctranslate2 sees an NVIDIA GPU
  device: auto
  language: en
  compute_type_cuda: float16
  compute_type_cpu: int8

tts:
  enabled: true
  mute: false
  # Cute US female (Amy). Other females: en_US-kristin-medium, en_US-hfc_female-medium
  voice: en_US-amy-medium
  length_scale: 1.05
  piper_dir: models/piper
  max_sentence_chars: 280
  voices:
    - en_US-amy-medium
    - en_US-kristin-medium
    - en_US-hfc_female-medium

audio:
  sample_rate: 16000
  mic_device: null          # null = system default; override with a device index
  mic_device_name: null     # re-resolved at startup if the index moves
  speaker_device: null
  speaker_device_name: null
  silence_ms: 800
  min_utterance_ms: 350
  energy_threshold: 0.012   # RMS; raise if it false-triggers
  max_utterance_seconds: 20
  # Optional. Off by default. Needs pycaw to duck the Windows output; otherwise use an OBS sidechain.
  duck_enabled: false
  duck_gain: 0.25
  # Talk-over stops Pixel. Echo gate ignores speaker bleed unless PTT is held or the level is much louder.
  barge_in: true
  echo_gate: true
  echo_gate_ratio: 2.5
  # Local wake word via openwakeword. Off by default, and never the only way to talk.
  wake_word: false
  wake_models:
    - hey_jarvis
  wake_threshold: 0.5

chat:
  buffer_size: 40
  cooldown_seconds: 12
  max_replies_per_minute: 8
  scan_interval_seconds: 3
  mention_boost: true
  post_voice_replies_to_chat: true
  chat_max_chars: 200
  per_user_cooldown_seconds: 20
  auto_reconnect: true
  min_send_gap_seconds: 1.2
  ambient_context_lines: 6
  commands:
    - "!so"
    - "!pixel"
    - "!ask"
  # !so is also a mod command: viewers are dropped with skip reason "not a mod".
  mod_commands:
    - "!so"
  shoutout_cooldown_seconds: 120
  # Pending viewer lines older than this are dropped (streamer lines and commands stay).
  max_age_seconds: 45

memory:
  chat_context_lines: 20
  events: 80
  viewers: 48
  thread_turns: 12
  catchphrase_seconds: 600
  retention_days: 14

events:
  enabled: true
  announce_follows: true
  follow_batch_seconds: 8
  speak: true
  post_to_chat: true
  # Each of these is off until you turn it on. Missing scopes skip that feed only.
  bits: false
  channel_points: false
  hype_train: false
  polls: false
  predictions: false
  channel_point_rewards:
    hydrate: speak

overlay:
  alert_hold_seconds: 6

safety:
  # Pixel strips links from chat posts unless this is true.
  allow_links: false
